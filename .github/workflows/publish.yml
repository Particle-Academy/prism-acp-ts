name: Publish

# Named `publish.yml` to match the rest of the estate, and the FILENAME is
# load-bearing: an npm Trusted Publisher binds to a repository plus a workflow
# filename, so renaming this file breaks publishing until the entry on
# npmjs.com is updated to match. It is not a cosmetic name.

# Publishing is a tag push, and nothing else. There is no manual dispatch and no
# "publish from a branch" path, because both let a release exist that no commit
# in this repository claims.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  guard:
    name: Guard the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      require-signing: ${{ steps.signing-policy.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Run again at publish time, not only when the commit landed: a dependency
      # that has since gone unmaintained, or an approval since withdrawn from the
      # allowlist, should stop the release.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - name: Resolve the repository signing policy before entering the release environment
        id: signing-policy
        env:
          REQUIRE_SUPERVISOR_SIGNING: ${{ vars.REQUIRE_SUPERVISOR_SIGNING }}
        run: node tools/supervisor-native/signing-policy.mjs

      # A tag is a human action and package.json is a file; nothing keeps the two
      # in step. Publishing v0.2.0 from a tree that declares 0.1.0 puts a version
      # on npm that no commit here claims -- and npm is append-only, so it can be
      # deprecated but never replaced.
      - name: Tag must match the declared version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          echo "tag=${tag}  package.json=${declared}"

          if [ "${tag}" != "${declared}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} means ${tag}, but package.json declares ${declared}. Fix one of them."
            exit 1
          fi

      # `private: true` refuses to publish, which is the correct default for a
      # package that is not ready. Caught HERE with an explanation rather than
      # left to npm's own error at the end of a release, because the fix is a
      # decision -- is this package meant to be public? -- not a retry.
      - name: Package must not be marked private
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "::error::package.json sets \"private\": true, so npm will refuse to publish it. Remove the flag deliberately, or do not tag this package."
            exit 1
          fi

      # The tests ran when this commit landed on main. Establishing THAT before
      # publishing is the point: a release that assumes green is the failure this
      # ecosystem keeps finding in its own work.
      #
      # Asked of the tests.yml workflow by FILENAME rather than by display name,
      # because a workflow can be renamed and a filename is the identity.
      - name: Tests must have SUCCEEDED for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')"
          echo "Successful Tests runs for ${GITHUB_SHA}: ${count}"

          if [ "${count}" -lt 1 ]; then
            echo "::error::No successful Tests run for ${GITHUB_SHA}. Refusing to publish."
            exit 1
          fi

      # The annotation IS the changelog. These packages ship no CHANGELOG file,
      # and the release job reads the tag's message and publishes it verbatim, so
      # the one question a consumer most needs answered has to be in it. It
      # usually was not: of the twenty most recent annotations across ten of these
      # repositories, EIGHTEEN never used the word "breaking" at all. One shipped
      # a mandatory migration, a changed matching rule and a raised framework
      # floor under headings that labelled none of them breaking.
      #
      # So this asks, and like the lightweight-tag refusal it treats silence as
      # invalid rather than as "no". tools/check-release-notes.sh documents the
      # accepted forms, why prose mentioning "breaking" is not one of them, and
      # why a '#' heading needs --cleanup=verbatim to survive being written.
      #
      # The annotation is read from the API because actions/checkout creates a
      # LIGHTWEIGHT local tag, so reading the message from the checkout yields the
      # COMMIT message instead -- plausibly, and without error.
      #
      # This job runs BEFORE the upload, so refusing here genuinely prevents
      # publication -- unlike the Composer packages in this ecosystem, where
      # Packagist has the version the moment the tag is pushed and their guard
      # can only withhold the GitHub release.
      - name: Release notes must declare their breaking status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"

          if [ "${TAG_TYPE}" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag, so it carries no notes. Tag with 'git tag -a' -- the message IS the release notes."
            exit 1
          fi

          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.message' > "${RUNNER_TEMP}/release-notes.md"

          sh tools/check-release-notes.sh "${RUNNER_TEMP}/release-notes.md"

  native-supervisor:
    name: Reproduce exact reviewed Windows payloads from this tag
    needs: guard
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      unsigned-sha256: ${{ steps.stage-supervisors.outputs.sha256 }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
      REQUIRE_SUPERVISOR_SIGNING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/g255-tag-dotnet-sdk
        with:
          dotnet-version: 10.0.403
      - run: npm ci
      - run: npm run build
      - name: Two clean tag builds must match each other and the reviewed npm assets
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Exact package version tag required' }
          $tagRoot = Join-Path $env:RUNNER_TEMP 'g255-tag-native'
          if (Test-Path -LiteralPath $tagRoot) { throw 'Refuse to reuse a prior tag build' }
          New-Item -ItemType Directory -Path $tagRoot | Out-Null
          node tools/supervisor-native/build.mjs "$tagRoot/first"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/supervisor-native/build.mjs "$tagRoot/second"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/supervisor-native/compare.mjs "$tagRoot/first" "$tagRoot/second" "${{ github.workspace }}/native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage unsigned images and the reviewed dependency-free verifier bundle
        id: stage-supervisors
        run: node tools/supervisor-native/stage-signing-bundle.mjs "$env:RUNNER_TEMP/g256-staged-supervisors"
      - name: Preserve staged unsigned release inputs
        uses: actions/upload-artifact@v4
        with:
          name: windows-supervisor-staged
          path: ${{ runner.temp }}/g256-staged-supervisors/
          if-no-files-found: error
      - name: Preserve exact-tag reproduction evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-supervisor-exact-tag
          path: ${{ runner.temp }}/g255-tag-native/
          if-no-files-found: error

  sign-supervisor:
    name: Sign only reviewed supervisor images with the protected publisher identity
    needs: [guard, native-supervisor]
    if: needs.guard.outputs.require-signing == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      payload-sha256: ${{ steps.release-payload.outputs.sha256 }}
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      REQUIRE_SUPERVISOR_SIGNING: 'true'
      SUPERVISOR_UNSIGNED_RELEASE_SHA256: ${{ needs.native-supervisor.outputs.unsigned-sha256 }}
      ARTIFACT_SIGNING_ENDPOINT: https://eus.codesigning.azure.net
      ARTIFACT_SIGNING_ACCOUNT: renaissance-analytics
      ARTIFACT_SIGNING_PROFILE: genie-public
      G256_VERIFIER_BOOTSTRAP_SHA256: 'c7eacb4e04adf3cd1943fb0dc887f309afcb396e0be1015550c10e629780ff45'
      G256_UNSIGNED_X64_SHA256: 'd91419bc8155b85f75344076b28f3d4baa56b4300840dbd4eefd496d016d3de1'
      G256_UNSIGNED_ARM64_SHA256: '0f9cd0ff89704cd924e397a496eb896dd3e89e0f3fae04f9a2d14ae7fe99e361'
    steps:
      - name: Download this run's staged unsigned inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-supervisor-staged
          path: ${{ runner.temp }}/g256-staged-supervisors
      - name: Verify immutable bootstrap and all reviewed code before executing downloaded verifiers
        shell: pwsh
        env:
          G256_BUNDLE: ${{ runner.temp }}/g256-staged-supervisors
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $imagePins = @{ x64 = $env:G256_UNSIGNED_X64_SHA256; arm64 = $env:G256_UNSIGNED_ARM64_SHA256 }
          foreach ($arch in @('x64', 'arm64')) {
            $image = Join-Path $env:G256_BUNDLE ('unsigned/win32-' + $arch + '/prism-acp-supervisor.exe')
            $rawDigest = (Get-FileHash -LiteralPath $image -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($rawDigest -cne $imagePins[$arch]) { throw ('Reviewed unsigned supervisor required: ' + $arch) }
          }
          $bootstrap = Join-Path $env:G256_BUNDLE 'tools/supervisor-native/verify-signing-bundle.mjs'
          $digest = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -cne $env:G256_VERIFIER_BOOTSTRAP_SHA256) { throw 'Reviewed verifier bootstrap required' }
          node "$bootstrap" "$env:G256_BUNDLE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:G256_BUNDLE/tools/supervisor-native/release-payload.mjs" prepare-signed "$env:RUNNER_TEMP/g256-release-supervisors" "$env:G256_BUNDLE/unsigned"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Azure login with the release environment federated identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2, exact reviewed commit
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publisher sign both reproduced supervisor copies
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: renaissance-analytics
          certificate-profile-name: genie-public
          files: |
            ${{ runner.temp }}/g256-release-supervisors/win32-x64/prism-acp-supervisor.exe
            ${{ runner.temp }}/g256-release-supervisors/win32-arm64/prism-acp-supervisor.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify reviewed image digests and required trusted timestamped signatures
        id: release-payload
        run: node "$env:RUNNER_TEMP/g256-staged-supervisors/tools/supervisor-native/release-payload.mjs" finalize "$env:RUNNER_TEMP/g256-release-supervisors"
      - name: Preserve verified supervisor release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, exact reviewed commit
        with:
          name: windows-supervisor-release
          path: ${{ runner.temp }}/g256-release-supervisors/
          if-no-files-found: error
  publish:
    name: Build and publish to npm
    needs: [guard, native-supervisor, sign-supervisor]
    if: always() && needs.guard.result == 'success' && needs.native-supervisor.result == 'success' && (needs.guard.outputs.require-signing != 'true' || needs.sign-supervisor.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `read`, not write: this job only builds and publishes. Creating the
      # GitHub release is a separate job with its own write grant, so nothing
      # here needs to modify the repository.
      contents: read
      # OIDC. This is what replaces a stored npm token: there is no long-lived
      # credential in this repository's secrets to leak, rotate or exfiltrate,
      # and it is what lets npm attach a provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Build
        run: npm run build

      # `files` lists dist, so a publish with no dist ships an empty package that
      # installs and imports as undefined. npm does not consider that an error.
      - name: The build actually produced something
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "::error::dist/ is missing or empty after the build, so this would publish an empty package."
            exit 1
          fi

      - name: Download this run's verified Windows supervisor payload
        if: needs.guard.outputs.require-signing == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-supervisor-release
          path: ${{ runner.temp }}/g256-release-supervisors
      - name: Download this run's unsigned supervisor payload when signing is disabled
        if: needs.guard.outputs.require-signing != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-supervisor-staged
          path: ${{ runner.temp }}/g256-staged-supervisors
      - name: Bind npm assets and the packed tarball to the Windows producer receipt
        env:
          REQUIRE_SUPERVISOR_SIGNING: ${{ needs.guard.outputs.require-signing }}
          SUPERVISOR_RELEASE_SHA256: ${{ needs.guard.outputs.require-signing == 'true' && needs.sign-supervisor.outputs.payload-sha256 || needs.native-supervisor.outputs.unsigned-sha256 }}
          G256_PAYLOAD_ROOT: ${{ runner.temp }}/${{ needs.guard.outputs.require-signing == 'true' && 'g256-release-supervisors' || 'g256-staged-supervisors/unsigned' }}
        run: |
          node tools/supervisor-native/release-payload.mjs install "$G256_PAYLOAD_ROOT"
          mkdir "$RUNNER_TEMP/g256-pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/g256-pack"
          node tools/supervisor-native/verify-pack.mjs "$G256_PAYLOAD_ROOT" "$RUNNER_TEMP/g256-pack"

      # `--provenance` records WHICH workflow, at which commit, built this
      # tarball, and npm shows it on the package page. It is the npm half of the
      # same argument as verifying Packagist actually serves a version: a
      # consumer should be able to check the artefact rather than trust it.
      # Trusted publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x. So
      # the npm that does the publish is NOT the one setup-node installed, and
      # the version is asserted rather than assumed -- an npm too old does not
      # fall back to something safe, it asks for a token that is not there and
      # fails at the end of a release.
      # No NODE_AUTH_TOKEN, deliberately. Publishing is authorised by the OIDC
      # token minted from `id-token: write` above, against a trusted publisher
      # configured for this package on npmjs.com -- so there is no long-lived
      # credential in this repository's secrets to leak, rotate or exfiltrate.
      #
      # This previously passed `secrets.NPM_TOKEN`, which no repository here
      # defines. An undefined secret expands to an EMPTY STRING rather than
      # failing, so the step would have run with blank auth and produced npm's
      # error rather than a statement of what was actually wrong.
      # Published by a PINNED npm, run through npx rather than installed.
      #
      # Three separate traps, all of which cost the Fancy estate time first:
      #   - setup-node with Node 22 bundles npm 10, and OIDC needs 11.5+
      #   - `npm install -g npm@latest` FAILS with MODULE_NOT_FOUND:
      #     promise-retry -- npm cannot reliably replace itself in place
      #   - `npm@latest` via npx is not safe either: 12.0.0 broke provenance
      #
      # So the version is pinned, not floated. Match this pin to the rest of the
      # estate rather than bumping it here alone.
      #
      # No NODE_AUTH_TOKEN, deliberately: authorisation is the OIDC token minted
      # by `id-token: write` above, against a Trusted Publisher configured for
      # this package on npmjs.com. This previously passed `secrets.NPM_TOKEN`,
      # which no repository here defines -- and an undefined secret expands to an
      # EMPTY STRING rather than failing, so it would have produced npm's own
      # auth error at the end of a release instead of naming the real problem.
      #
      # `--access public` on EVERY publish, not just the first: scoped packages
      # default to restricted.
      - name: Publish
        run: npx -y npm@11.18.0 publish "$RUNNER_TEMP/g256-pack/"*.tgz --provenance --access public

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The annotation is read from the GitHub API. Three other mechanisms were
      # tried in the PHP packages and all three silently published the wrong
      # text: --generate-notes substituted commit subjects, --notes-from-tag and
      # `git tag -l %(contents)` both substituted the last commit message,
      # because actions/checkout creates a LIGHTWEIGHT local tag.
      #
      # Asking the API also lets the lightweight case be DETECTED rather than
      # degraded: .object.type is "tag" for an annotated tag, "commit" otherwise.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving it alone."
            exit 0
          fi

          TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"

          if [ "${TAG_TYPE}" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a lightweight tag, so it carries no notes. Tag with 'git tag -a' -- the message IS the release notes."
            exit 1
          fi

          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_SHA}" --jq '.message' > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::${GITHUB_REF_NAME} has an empty annotation."
            exit 1
          fi

          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md --verify-tag

  distribution:
    name: Verify it is installable
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The step this ecosystem was missing. A tag is not a release and a release
      # is not a distribution: particle-academy/prism-human-plus was tagged and
      # had a GitHub release while `composer require` still failed, because
      # nobody had submitted it -- and nothing anywhere noticed.
      #
      # npm's registry is eventually consistent after a publish, so this polls
      # rather than checking once, and says what to DO when it never appears.
      # Fifteen minutes, not five: prism-opentelemetry-ts 0.2.0 was served after
      # the five-minute poll gave up, and only a rerun went green.
      # --prefer-online so a cached "not found" is not read back as the answer.
      - name: npm must serve this version
        run: |
          pkg="$(node -p "require('./package.json').name")"
          want="${GITHUB_REF_NAME#v}"
          echo "Waiting for ${pkg}@${want} on npm."

          for attempt in $(seq 1 30); do
            if npm view "${pkg}@${want}" version --prefer-online >/dev/null 2>&1; then
              echo "${pkg}@${want} is installable."
              exit 0
            fi
            echo "  attempt ${attempt}: not published yet."
            sleep 30
          done

          echo "::error::${pkg}@${want} never appeared on npm. Check the publish job, the package's scope permissions, and whether the @particle-academy scope allows this repository to publish."
          exit 1
