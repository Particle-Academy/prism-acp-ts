name: Tests

on:
  push:
    branches: [main, "*.x"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 are the supported LTS lines; 26 is current. NODE 20 WAS
        # REMOVED because it reached end of life on 2026-04-30 -- testing against
        # an unsupported runtime proves a package works where nobody should run
        # it, and declaring engines >=20 told consumers otherwise.
        #
        # This matrix was copied from a sibling that still carries 20, which is
        # how it got here: the list froze a correct answer from when 20 was
        # current LTS and went on defending the copy.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

  # Windows has its own containment (a Job Object, a csc-built supervisor), its own command resolution (npm shims, no
  # shell) and its own quoting, and none of it runs on Linux. It is verified here, never on a developer's desktop:
  # 0.21.0 shipped passing --settings and --mcp-config paths wrapped in quotes that only a Windows run could see.
  windows:
    name: windows, node 24
    runs-on: windows-latest
    needs: third-party
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run

      - name: AppContainer transport (owned profiles; no model or network access)
        run: npx vitest run test/appcontainer.test.ts
        env:
          PRISM_ACP_APPCONTAINER: '1'

  supervisor-cold-cache:
    name: Windows supervisor, parallel cold installs
    runs-on: windows-latest
    needs: third-party
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Released producer must fail; current producer must pass the same 20x8 oracle
        run: |
          node --test scripts/supervisor-cold-evidence.check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-supervisor-cold-cache.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve cold-cache measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-supervisor-cold-cache
          path: .cold-cache-evidence/
          include-hidden-files: true
          if-no-files-found: error

  codex-native-tools:
    name: Codex native tools, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Test tool only, not a package dependency. A changed CLI needs a new measured support matrix.
      - run: npm install --global --ignore-scripts @openai/codex@0.163.0
      - run: npx vitest run test/codex-native-tools-live.test.ts test/codex-replay-live.test.ts test/codex-plugin-startup-live.test.ts
        env:
          PRISM_ACP_CODEX_NATIVE_TOOLS: '1'

  claude-approval:
    name: Claude approval, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: claude
          - os: windows-latest
            platform: win32-x64
            binary: claude.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Native test executable only; no package dependency, install scripts, real login or model traffic.
      - name: Measure first and warm Windows approval overhead
        if: runner.os == 'Windows'
        run: npx vitest run test/claude-approval-latency.test.ts
        env:
          PRISM_ACP_HOOK_LATENCY: '1'
      - run: npm install --prefix .claude-native-cli --ignore-scripts --no-package-lock @anthropic-ai/claude-code-${{ matrix.platform }}@2.1.310
      - run: npx vitest run test/claude-approval-live.test.ts
        env:
          PRISM_ACP_CLAUDE_APPROVAL: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-native-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. The release guard requires this workflow to have succeeded for
      # the tagged commit, so a failure here also stops a publish.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  release-notes:
    name: Release-notes check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # tools/check-release-notes.sh refuses a tag annotation that does not say
      # whether the release breaks anything. It runs in publish.yml's guard, and
      # a release manager runs it by hand before tagging.
      #
      # It is tested HERE because a guard nobody tried to defeat is the recurring
      # way one of these ends up checking nothing. The suite asserts both
      # directions, and its sharpest case is a note that discusses breakage in
      # prose while declaring nothing: a plain `grep -i breaking` passes that, and
      # three real annotations in this estate are exactly that shape.
      - name: tools/check-release-notes.sh must refuse what it claims to
        run: sh tools/check-release-notes.test.sh

      # The checker is vendored rather than fetched, because for a Composer
      # package the pre-tag run is the only control that can prevent publication
      # and it has to work from the tree being tagged, offline, without piping a
      # remote script into a shell. That buys a copy, and an unchecked copy is one
      # that has already drifted without telling anyone -- prism-parity found 38
      # of 111 hand-maintained copies stale. So it is diffed, not trusted.
      - name: Fetch the canonical checker
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .canonical
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .canonical
          PIN_DIR: .canonical/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: The vendored checker must match the canonical one
        run: |
          for pair in check.sh:check-release-notes.sh check.test.sh:check-release-notes.test.sh; do
            diff -u ".canonical/release-notes/${pair%%:*}" "tools/${pair##*:}" || {
              echo "::error::tools/${pair##*:} has drifted from the pinned canonical repository release-notes/${pair%%:*}. Change the canonical file and re-vendor it; do not patch the copy."
              exit 1
            }
          done
          echo "Both vendored files match the canonical checker."
          rm -rf .canonical
