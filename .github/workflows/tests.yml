name: Tests

on:
  push:
    branches: [main, "*.x"]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Release and test workflow lint
    needs: third-party
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate YAML, expressions, action inputs and job dependencies
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          lint_root="$RUNNER_TEMP/g256-actionlint"
          mkdir "$lint_root"
          curl --fail --location --max-time 60 --output "$lint_root/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$lint_root/actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$lint_root/actionlint.tar.gz" --directory "$lint_root" actionlint
          "$lint_root/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml

  # CI is the only producer. Rebuild both architectures in two isolated roots,
  # then compare both with the reviewed bytes shipped in this exact checkout.
  native-supervisor-build:
    name: Deterministic Windows supervisor candidates
    needs: third-party
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5, exact reviewed action
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/g255-dotnet-sdk
        with:
          dotnet-version: 10.0.403
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build identical source in two isolated roots
        shell: pwsh
        run: |
          $candidateRoot = Join-Path $env:RUNNER_TEMP 'g255-candidates'
          if (Test-Path -LiteralPath $candidateRoot) { throw 'Refuse to replace prior native candidates' }
          [System.IO.Directory]::CreateDirectory($candidateRoot) | Out-Null
          node tools/supervisor-native/build.mjs "$candidateRoot/first"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/supervisor-native/build.mjs "$candidateRoot/second"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/supervisor-native/compare.mjs "$candidateRoot/first" "$candidateRoot/second" "${{ github.workspace }}/native"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve source-bound CI candidates
        uses: actions/upload-artifact@v4
        with:
          name: windows-supervisor-candidates
          path: ${{ runner.temp }}/g255-candidates/
          if-no-files-found: error

  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 are the supported LTS lines; 26 is current. NODE 20 WAS
        # REMOVED because it reached end of life on 2026-04-30 -- testing against
        # an unsupported runtime proves a package works where nobody should run
        # it, and declaring engines >=20 told consumers otherwise.
        #
        # This matrix was copied from a sibling that still carries 20, which is
        # how it got here: the list froze a correct answer from when 20 was
        # current LTS and went on defending the copy.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run
      - run: node tools/supervisor-native/pin-signing-verifiers.mjs --check

  # Windows has its own containment (a Job Object, a shipped supervisor), its own command resolution (npm shims, no
  # shell) and its own quoting, and none of it runs on Linux. It is verified here, never on a developer's desktop:
  # 0.21.0 shipped passing --settings and --mcp-config paths wrapped in quotes that only a Windows run could see.
  windows:
    name: windows, node 24
    runs-on: windows-latest
    needs: third-party
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run
      - run: node tools/supervisor-native/pin-signing-verifiers.mjs --check

      - name: AppContainer transport (owned profiles; no model or network access)
        run: npx vitest run test/appcontainer.test.ts
        env:
          PRISM_ACP_APPCONTAINER: '1'

      - name: Actual isolated signing bootstrap with fake identity and token-request canaries
        run: node tools/supervisor-native/check-signing-bootstrap.mjs "$env:RUNNER_TEMP/g256-bootstrap-proof"
      - name: Preserve bootstrap positive and producer-tamper refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-signing-bootstrap-proof
          path: ${{ runner.temp }}/g256-bootstrap-proof/
          if-no-files-found: error

  supervisor-cold-cache:
    name: Historical Windows compiler-cache regression
    runs-on: windows-latest
    needs: third-party
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Released 0.31 must fail; immutable 0.40 must pass the same 20x8 oracle
        run: |
          node --test scripts/supervisor-cold-evidence.check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-supervisor-cold-cache.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve cold-cache measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-supervisor-cold-cache
          path: .cold-cache-evidence/
          include-hidden-files: true
          if-no-files-found: error

  supervisor-shipped:
    name: Shipped supervisor, ${{ matrix.arch }}
    needs: [third-party, native-supervisor-build, supervisor-signed]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fetch this run's independently verified signed public images
        uses: actions/download-artifact@v4
        with:
          name: windows-signed-supervisor-oracle
          path: ${{ runner.temp }}/g255-signed-images
      - name: Verify both downloaded images against the package pins
        shell: pwsh
        run: node tools/supervisor-native/verify-signed.mjs "$env:RUNNER_TEMP/g255-signed-images"
      - name: Native shipped image and containment boundaries
        run: npx vitest run test/authenticode.test.ts test/windows-supervisor.test.ts test/process-tree-supervisor.test.ts test/process-tree.test.ts test/process-tree-options.test.ts test/private-directory.test.ts test/claude-approval-adapter.test.ts test/stop-verdict-observer.test.ts test/uncertain-cancel-tree.test.ts test/signed-supervisor.test.ts
        env:
          PRISM_ACP_SIGNED_SUPERVISOR_ROOT: ${{ runner.temp }}/g255-signed-images
      - name: Twenty batches of eight independent processes, with no compiler or executable writes
        shell: pwsh
        env:
          PRISM_ACP_SUPERVISOR_SHIPPED: '1'
        run: |
          New-Item -ItemType Directory -Path .shipped-supervisor-evidence | Out-Null
          node -e "console.log(JSON.stringify({head:process.env.GITHUB_SHA,arch:require('node:os').machine(),node:process.version}))" > .shipped-supervisor-evidence/checkout.json
          npx vitest run test/shipped-supervisor-measure.test.ts > .shipped-supervisor-evidence/native.log 2>&1
          exit $LASTEXITCODE
      - name: Preserve new shipped-runtime measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shipped-supervisor-${{ matrix.arch }}
          path: .shipped-supervisor-evidence/
          include-hidden-files: true
          if-no-files-found: error

  supervisor-signed:
    name: Windows SIP and genuinely signed host copies
    needs: [third-party, native-supervisor-build]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare actual Windows SIP digests before and after disposable signing
        shell: pwsh
        run: |
          ./tools/supervisor-native/authenticode-oracle.ps1 -OutputRoot "$env:RUNNER_TEMP/g255-signed-images"
          node tools/supervisor-native/verify-signed.mjs "$env:RUNNER_TEMP/g255-signed-images"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute a signed unpacked copy through every native mode
        shell: pwsh
        env:
          PRISM_ACP_SIGNED_SUPERVISOR_ROOT: ${{ runner.temp }}/g255-signed-images
        run: npx vitest run test/signed-supervisor.test.ts
      - name: Preserve signed images and independent digest receipts, never keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed-supervisor-oracle
          path: |
            ${{ runner.temp }}/g255-signed-images/signed-image-receipt.json
            ${{ runner.temp }}/g255-signed-images/x64-signed.exe
            ${{ runner.temp }}/g255-signed-images/arm64-signed.exe
          if-no-files-found: error

  codex-native-tools:
    name: Codex native tools, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Test tool only, not a package dependency. A changed CLI needs a new measured support matrix.
      - run: npm install --global --ignore-scripts @openai/codex@0.163.0
      - run: npx vitest run test/codex-native-tools-live.test.ts test/codex-replay-live.test.ts test/codex-plugin-startup-live.test.ts
        env:
          PRISM_ACP_CODEX_NATIVE_TOOLS: '1'
      - name: Native per-thread project document and skill configuration
        run: npx vitest run test/codex-config-native.test.ts
        env:
          PRISM_ACP_CODEX_CONFIG: '1'

  claude-approval:
    name: Claude approval, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: claude
          - os: windows-latest
            platform: win32-x64
            binary: claude.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Native test executable only; no package dependency, install scripts, real login or model traffic.
      - name: Measure first and warm Windows approval overhead
        if: runner.os == 'Windows'
        run: npx vitest run test/claude-approval-latency.test.ts
        env:
          PRISM_ACP_HOOK_LATENCY: '1'
      - run: npm install --prefix .claude-native-cli --ignore-scripts --no-package-lock @anthropic-ai/claude-code-${{ matrix.platform }}@2.1.310
      - run: npx vitest run test/claude-approval-live.test.ts
        env:
          PRISM_ACP_CLAUDE_APPROVAL: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-native-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}

  claude-restricted:
    name: Claude app MCP only, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: claude
          - os: windows-latest
            platform: win32-x64
            binary: claude.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Exact native test executable; no install scripts, real login or model traffic.
      - run: npm install --prefix .claude-restricted-cli --ignore-scripts --no-package-lock @anthropic-ai/claude-code-${{ matrix.platform }}@2.1.311
      - name: Native restricted catalog and hostile tool calls
        run: npx vitest run test/claude-restricted-native.test.ts
        env:
          PRISM_ACP_CLAUDE_RESTRICTED: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-restricted-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}
      - name: Native settings sources and strict MCP configuration
        run: npx vitest run test/claude-settings-native.test.ts
        env:
          PRISM_ACP_CLAUDE_SETTINGS: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-restricted-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}
      - name: Native append files and plugin directory or zip paths
        run: npx vitest run test/claude-file-options-native.test.ts
        env:
          PRISM_ACP_CLAUDE_FILE_OPTIONS: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-restricted-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}
      - name: Native startup and stdio MCP discovery in a zero-capability AppContainer
        if: runner.os == 'Windows'
        run: npx vitest run test/appcontainer.test.ts
        env:
          PRISM_ACP_APPCONTAINER: '1'
          PRISM_ACP_CLAUDE_RESTRICTED: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-restricted-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}

  claude-tool-rules:
    name: Claude tool rules, ${{ matrix.platform }}, ${{ matrix.cli }}
    runs-on: ${{ matrix.os }}
    needs: third-party
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cli: ['2.1.203', '2.1.295', '2.1.311']
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: claude
          - os: windows-latest
            platform: win32-x64
            binary: claude.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Test executable only. No runtime dependency, install scripts, real login or provider traffic.
      - run: npm install --prefix .claude-tool-rules-cli --ignore-scripts --no-package-lock @anthropic-ai/claude-code-${{ matrix.platform }}@${{ matrix.cli }}
      - name: Native allow and deny with one comma-and-space rule per argv value
        run: npx vitest run test/claude-tool-rules-native.test.ts
        env:
          PRISM_ACP_CLAUDE_TOOL_RULES: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.claude-tool-rules-cli/node_modules/@anthropic-ai/claude-code-${{ matrix.platform }}/${{ matrix.binary }}

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. The release guard requires this workflow to have succeeded for
      # the tagged commit, so a failure here also stops a publish.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  release-notes:
    name: Release-notes check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The checker is vendored rather than fetched, because for a Composer
      # package the pre-tag run is the only control that can prevent publication
      # and it has to work from the tree being tagged, offline, without piping a
      # remote script into a shell. That buys a copy, and an unchecked copy is one
      # that has already drifted without telling anyone -- prism-parity found 38
      # of 111 hand-maintained copies stale. So it is diffed, not trusted.
      - name: Fetch the canonical checker
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          path: .canonical
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .canonical
          PIN_DIR: .canonical/third-party
          PIN_SHA: cb221e7936f8a01f2ab047a6488b253bc435d7f9
          PIN_SHA256: |
            b6ce9746345825e37beb9655e1b124c706cf5451e960b7ee3e548fa3a086f706  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            720d6d7393e943c599dab248511b8e89f29d51993c31cfaf7bda9292638b74e3  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: The vendored checker must match the canonical one
        run: |
          for pair in check.sh:check-release-notes.sh check.test.sh:check-release-notes.test.sh; do
            diff -u ".canonical/release-notes/${pair%%:*}" "tools/${pair##*:}" || {
              echo "::error::tools/${pair##*:} has drifted from the pinned canonical repository release-notes/${pair%%:*}. Change the canonical file and re-vendor it; do not patch the copy."
              exit 1
            }
          done
          echo "Both vendored files match the canonical checker."
          rm -rf .canonical

      # tools/check-release-notes.sh refuses a tag annotation that does not say
      # whether the release breaks anything. It runs in publish.yml's guard, and
      # a release manager runs it by hand before tagging.
      #
      # It is tested HERE because a guard nobody tried to defeat is the recurring
      # way one of these ends up checking nothing. The suite asserts both
      # directions, and its sharpest case is a note that discusses breakage in
      # prose while declaring nothing: a plain `grep -i breaking` passes that, and
      # three real annotations in this estate are exactly that shape.
      - name: tools/check-release-notes.sh must refuse what it claims to
        run: sh tools/check-release-notes.test.sh
